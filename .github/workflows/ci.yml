name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Circus builds hydraJobs, including checks, for pushes and pull requests.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pschmitt/ci-workflows/.github/actions/nix-setup@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Check every plugin
        run: nix flake check --print-build-logs
