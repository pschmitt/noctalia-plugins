# Detects active portal shares directly from PipeWire's graph. The packaged
# plugin embeds an absolute pw-cli path; it needs neither jq nor an external
# xdg-desktop-portal watcher/state-file service.

id = "pschmitt/screencast"
name = "Screencast Indicator"
version = "0.6.2"
plugin_api = 24 # argument-array runAsync() keeps the pw-cli calls shell-free
author = "pschmitt"
license = "GPL-3.0-only"
tags = ["bar", "indicator", "utility"]
icon = "screen-share"
description = "Red dot + REC bar indicator while portal-based screensharing is active."
# hyprctl is Hyprland-only and used opportunistically (click-to-focus a
# sharing client in panel.luau) -- every other runAsync target here is either
# this declared-dependencies PATH lookup (see other plugins' own
# `dependencies`) or a build-time substituted absolute path (pw-cli in
# service.luau), so an undeclared bare "hyprctl" would not resolve at all.
# Harmless to declare on non-Hyprland desktops: the focus feature just stays
# a no-op there, same as it silently is today when hyprctl is missing.
dependencies = ["hyprctl"]

# ── Plugin-level settings (shared by every entry, edited in Settings -> Plugins) ──

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 2
min = 1
max = 30

[[setting]]
key = "show_label"
type = "bool"
label_key = "settings.show_label.label"
description_key = "settings.show_label.description"
default = true

[[setting]]
key = "label_text"
type = "string"
label_key = "settings.label_text.label"
description_key = "settings.label_text.description"
default = "REC"

[[setting]]
key = "dot_color"
type = "color"
label_key = "settings.dot_color.label"
description_key = "settings.dot_color.description"
default = "error"

[[setting]]
key = "label_color"
type = "color"
label_key = "settings.label_color.label"
description_key = "settings.label_color.description"
default = "error"

[[setting]]
key = "dot_size"
type = "int"
label_key = "settings.dot_size.label"
description_key = "settings.dot_size.description"
default = 8
min = 4
max = 16

[[setting]]
key = "pulse_enabled"
type = "bool"
label_key = "settings.pulse_enabled.label"
description_key = "settings.pulse_enabled.description"
default = true

[[setting]]
key = "pulse_period_ms"
type = "int"
label_key = "settings.pulse_period_ms.label"
description_key = "settings.pulse_period_ms.description"
default = 1200
min = 300
max = 5000

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[widget.actions]
left = "panel-toggle pschmitt/screencast:panel"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 360
height = 280
placement = "attached"
position = "auto"
open_near_click = true
