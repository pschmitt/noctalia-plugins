# Bar icon + panel for lan-mouse (software KVM switch, see
# https://github.com/feschber/lan-mouse). lan-mouse itself has no query for
# "which side currently owns the cursor" -- only per-client connection state
# (`lan-mouse cli list`) -- so this relies on a sentinel file that
# nixos-config's `home-manager/gui/lan-mouse.nix` `enter_hook` maintains: it
# holds the peer's name while control is away, and is absent while control is
# on this host. The panel's peer list (hostname, position, connection state)
# comes straight from `lan-mouse cli list`.
# The bar stays visible while the service is stopped so it can show status
# and provide a way to start it. The lockscreen widget still hides while off.
#
# Also ships a lockscreen widget (lockscreen.luau): a "bring input back"
# button for when a peer's session is locked and can no longer release
# capture by edge-crossing (session locks grab input exclusively), the only
# other way back being nixos-config's `releaseBind` key combo.

id = "pschmitt/lan-mouse"
name = "Lan Mouse"
version = "0.2.0"
plugin_api = 24 # argument-array runAsync() keeps the `lan-mouse cli` call shell-free
author = "pschmitt"
license = "GPL-3.0-only"
tags = ["bar", "indicator", "utility"]
icon = "mouse"
description = "Shows Lan Mouse service status with a panel for starting, stopping, and managing peers."
dependencies = ["lan-mouse"]

[[setting]]
key = "away_sentinel"
type = "string"
label_key = "settings.away_sentinel.label"
description_key = "settings.away_sentinel.description"
default = "$XDG_RUNTIME_DIR/lan-mouse-away"

[[setting]]
key = "incoming_sentinel"
type = "string"
label_key = "settings.incoming_sentinel.label"
description_key = "settings.incoming_sentinel.description"
default = "$XDG_RUNTIME_DIR/lan-mouse-incoming"

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 1
min = 1
max = 30

[[setting]]
key = "icon_color"
type = "color"
label_key = "settings.icon_color.label"
description_key = "settings.icon_color.description"
default = "primary"

[[setting]]
key = "show_label"
type = "bool"
label_key = "settings.show_label.label"
description_key = "settings.show_label.description"
default = false

[[setting]]
key = "go_back_command"
type = "string"
label_key = "settings.go_back_command.label"
description_key = "settings.go_back_command.description"
default = "~/.config/lan-mouse/go-back"

[[setting]]
key = "stop_command"
type = "string"
label_key = "settings.stop_command.label"
description_key = "settings.stop_command.description"
default = ""

[[setting]]
key = "start_command"
type = "string"
label_key = "settings.start_command.label"
description_key = "settings.start_command.description"
default = ""

[[setting]]
key = "gui_command"
type = "string"
label_key = "settings.gui_command.label"
description_key = "settings.gui_command.description"
default = ""

[[setting]]
key = "ssh_command"
type = "string"
label_key = "settings.ssh_command.label"
description_key = "settings.ssh_command.description"
default = ""

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[widget.actions]
left = "panel-toggle pschmitt/lan-mouse:panel"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 320
height = 280
placement = "attached"
position = "auto"
open_near_click = true

[[desktop_widget]]
id = "lockscreen"
entry = "lockscreen.luau"
