# State comes from the local daemon input-state snapshot.

id = "pschmitt/lan-mouse"
name = "Lan Mouse"
version = "0.4.0"
plugin_api = 42
author = "pschmitt"
license = "GPL-3.0-only"
tags = ["bar", "indicator", "utility"]
icon = "mouse"
description = "Shows Lan Mouse service status with a panel for starting, stopping, and managing peers."
dependencies = ["lan-mouse"]

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 1
min = 1
max = 30

[[setting]]
key = "icon_color"
type = "color"
label_key = "settings.icon_color.label"
description_key = "settings.icon_color.description"
default = "primary"

[[setting]]
key = "show_label"
type = "bool"
label_key = "settings.show_label.label"
description_key = "settings.show_label.description"
default = false

[[setting]]
key = "go_back_command"
type = "string"
label_key = "settings.go_back_command.label"
description_key = "settings.go_back_command.description"
default = "~/.config/lan-mouse/go-back"

[[setting]]
key = "stop_command"
type = "string"
label_key = "settings.stop_command.label"
description_key = "settings.stop_command.description"
default = ""

[[setting]]
key = "start_command"
type = "string"
label_key = "settings.start_command.label"
description_key = "settings.start_command.description"
default = ""

[[setting]]
key = "gui_command"
type = "string"
label_key = "settings.gui_command.label"
description_key = "settings.gui_command.description"
default = ""

[[setting]]
key = "animations_enabled"
type = "bool"
label_key = "settings.animations_enabled.label"
description_key = "settings.animations_enabled.description"
default = true

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[widget.actions]
left = "panel-toggle pschmitt/lan-mouse:panel"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 320
height = "content"
max_height = 480
placement = "attached"
position = "auto"
open_near_click = true

[[desktop_widget]]
id = "lockscreen"
entry = "lockscreen.luau"
