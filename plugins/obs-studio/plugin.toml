id = "pschmitt/obs-studio"
name = "OBS Studio"
version = "0.1.0"
plugin_api = 24
author = "pschmitt"
license = "GPL-3.0-only"
icon = "video"
description = "Current scene, recording/streaming status, a scene switcher panel, and configurable quick actions for OBS Studio, driven by obs-cli/obs-control."
tags = ["bar", "panel", "service", "indicator", "utility"]
dependencies = ["obs-cli", "obs-control"]

# ── Connection ───────────────────────────────────────────────────────────────

[[setting]]
key = "host"
type = "string"
label_key = "settings.host.label"
description_key = "settings.host.description"
default = "localhost"

[[setting]]
key = "port"
type = "int"
label_key = "settings.port.label"
description_key = "settings.port.description"
default = 6277
min = 1
max = 65535

# Read only at request time, the same sops-nix runtime-secret pattern
# pschmitt/ha's server_file/token_file use. Left at its default, this already
# points at the canonical path obs-control itself falls back to (see
# home-manager/gui/go-hass-agent's obs/websocket/password sops template), so
# most hosts need no change here at all.
[[setting]]
key = "password_file"
type = "file"
label_key = "settings.password_file.label"
description_key = "settings.password_file.description"
default = "~/.config/obs-studio/obs-websocket.password"

[[setting]]
key = "obs_cli_path"
type = "string"
label_key = "settings.obs_cli_path.label"
description_key = "settings.obs_cli_path.description"
default = "obs-cli"
advanced = true

[[setting]]
key = "obs_control_path"
type = "string"
label_key = "settings.obs_control_path.label"
description_key = "settings.obs_control_path.description"
default = "obs-control"
advanced = true

[[setting]]
key = "mic_input_name"
type = "string"
label_key = "settings.mic_input_name.label"
description_key = "settings.mic_input_name.description"
default = ""
advanced = true

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 5
min = 2
max = 60

# ── Bar ──────────────────────────────────────────────────────────────────────

[[setting]]
key = "bar_display_mode"
type = "select"
label_key = "settings.bar_display_mode.label"
description_key = "settings.bar_display_mode.description"
default = "icon_and_scene"
options = [
  { value = "icon_and_scene", label_key = "settings.bar_display_mode.icon_and_scene" },
  { value = "scene_only", label_key = "settings.bar_display_mode.scene_only" },
  { value = "icon_only", label_key = "settings.bar_display_mode.icon_only" },
]

[[setting]]
key = "bar_icon"
type = "glyph"
label_key = "settings.bar_icon.label"
description_key = "settings.bar_icon.description"
default = "video"

[[setting]]
key = "bar_max_scene_length"
type = "int"
label_key = "settings.bar_max_scene_length.label"
description_key = "settings.bar_max_scene_length.description"
default = 18
min = 6
max = 40

[[setting]]
key = "bar_show_rec_indicator"
type = "bool"
label_key = "settings.bar_show_rec_indicator.label"
description_key = "settings.bar_show_rec_indicator.description"
default = true

[[setting]]
key = "bar_show_stream_indicator"
type = "bool"
label_key = "settings.bar_show_stream_indicator.label"
description_key = "settings.bar_show_stream_indicator.description"
default = true

[[setting]]
key = "animations_enabled"
type = "bool"
label_key = "settings.animations_enabled.label"
description_key = "settings.animations_enabled.description"
default = true

# Same runAction()/ACTIONS convention pschmitt/ha and pschmitt/fan-control use
# for their own click/scroll settings, right down to the shared
# settings.action.* description/option translation keys.
[[setting]]
key = "action_left_click"
type = "select"
label_key = "settings.action_left_click.label"
description_key = "settings.action.description"
default = "panel"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "next_scene", label_key = "settings.action.options.next_scene" },
  { value = "prev_scene", label_key = "settings.action.options.prev_scene" },
  { value = "toggle_record", label_key = "settings.action.options.toggle_record" },
  { value = "toggle_stream", label_key = "settings.action.options.toggle_stream" },
  { value = "toggle_virtualcam", label_key = "settings.action.options.toggle_virtualcam" },
  { value = "toggle_mute", label_key = "settings.action.options.toggle_mute" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_right_click"
type = "select"
label_key = "settings.action_right_click.label"
description_key = "settings.action.description"
default = "toggle_mute"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "next_scene", label_key = "settings.action.options.next_scene" },
  { value = "prev_scene", label_key = "settings.action.options.prev_scene" },
  { value = "toggle_record", label_key = "settings.action.options.toggle_record" },
  { value = "toggle_stream", label_key = "settings.action.options.toggle_stream" },
  { value = "toggle_virtualcam", label_key = "settings.action.options.toggle_virtualcam" },
  { value = "toggle_mute", label_key = "settings.action.options.toggle_mute" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_middle_click"
type = "select"
label_key = "settings.action_middle_click.label"
description_key = "settings.action.description"
default = "toggle_record"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "next_scene", label_key = "settings.action.options.next_scene" },
  { value = "prev_scene", label_key = "settings.action.options.prev_scene" },
  { value = "toggle_record", label_key = "settings.action.options.toggle_record" },
  { value = "toggle_stream", label_key = "settings.action.options.toggle_stream" },
  { value = "toggle_virtualcam", label_key = "settings.action.options.toggle_virtualcam" },
  { value = "toggle_mute", label_key = "settings.action.options.toggle_mute" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_scroll_up"
type = "select"
label_key = "settings.action_scroll_up.label"
description_key = "settings.action.description"
default = "prev_scene"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "next_scene", label_key = "settings.action.options.next_scene" },
  { value = "prev_scene", label_key = "settings.action.options.prev_scene" },
  { value = "toggle_record", label_key = "settings.action.options.toggle_record" },
  { value = "toggle_stream", label_key = "settings.action.options.toggle_stream" },
  { value = "toggle_virtualcam", label_key = "settings.action.options.toggle_virtualcam" },
  { value = "toggle_mute", label_key = "settings.action.options.toggle_mute" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_scroll_down"
type = "select"
label_key = "settings.action_scroll_down.label"
description_key = "settings.action.description"
default = "next_scene"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "next_scene", label_key = "settings.action.options.next_scene" },
  { value = "prev_scene", label_key = "settings.action.options.prev_scene" },
  { value = "toggle_record", label_key = "settings.action.options.toggle_record" },
  { value = "toggle_stream", label_key = "settings.action.options.toggle_stream" },
  { value = "toggle_virtualcam", label_key = "settings.action.options.toggle_virtualcam" },
  { value = "toggle_mute", label_key = "settings.action.options.toggle_mute" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "none", label_key = "settings.action.options.none" },
]

# ── Panel ────────────────────────────────────────────────────────────────────

[[setting]]
key = "panel_show_scene_list"
type = "bool"
label_key = "settings.panel_show_scene_list.label"
description_key = "settings.panel_show_scene_list.description"
default = true

[[setting]]
key = "panel_show_quick_actions"
type = "bool"
label_key = "settings.panel_show_quick_actions.label"
description_key = "settings.panel_show_quick_actions.description"
default = true

[[setting]]
key = "panel_show_custom_buttons"
type = "bool"
label_key = "settings.panel_show_custom_buttons.label"
description_key = "settings.panel_show_custom_buttons.description"
default = true

[[setting]]
key = "custom_buttons_columns"
type = "int"
label_key = "settings.custom_buttons_columns.label"
description_key = "settings.custom_buttons_columns.description"
default = 2
min = 1
max = 4

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "bar_icon_size"
  type = "int"
  label_key = "settings.bar_icon_size.label"
  description_key = "settings.bar_icon_size.description"
  default = 16
  min = 10
  max = 32

  [[widget.setting]]
  key = "bar_spacing"
  type = "int"
  label_key = "settings.bar_spacing.label"
  description_key = "settings.bar_spacing.description"
  default = 6
  min = 0
  max = 32

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = 580
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
keyboard_focus = "exclusive"
capture_keys = ["up", "down", "enter", "kp_enter"]
