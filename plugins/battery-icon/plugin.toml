id = "pschmitt/battery-icon"
name = "Battery Icon"
version = "0.5.2"
plugin_api = 26 # noctalia.getSetting(), needed to resolve palette-role color values
author = "pschmitt"
license = "GPL-3.0-only"
tags = ["bar", "system", "hardware"]
icon = "battery-2"
description = "Material 3 Expressive battery indicator with a compact power-control panel, rendered as a live-generated bitmap."
# magick renders the icon bitmap, powerprofilesctl detects Battery Saver
# (drawn as the Android-style "+" glyph, not a body colour). busctl reads upower's OnBattery property (the portable
# "external power connected?" bit — see AC_ONLINE_CMD in service.luau) and,
# via `busctl wait`, streams changes to it for instant plug/unplug detection;
# stdbuf keeps that stream unbuffered. udevadm is the same edge without
# upower. noctalia controls Caffeine from the power panel.
dependencies = ["magick", "powerprofilesctl", "udevadm", "busctl", "stdbuf", "noctalia"]

# ── Plugin-level settings (shared by every entry, edited in Settings -> Plugins) ──

[[setting]]
key = "battery_device"
type = "string"
label_key = "settings.battery_device.label"
description_key = "settings.battery_device.description"
default = "BAT0"

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
# Only a safety net for the charge percentage, which moves at most ~1%/min:
# plug/unplug is edge-triggered by the D-Bus and udev streams in
# service.luau, so a short interval bought nothing but four extra process
# spawns per tick.
default = 60
min = 5
max = 300

# Machines with a firmware charge limit never reach 100%, which would leave
# the color tiers permanently pessimistic. 0 (the default) resolves the limit
# at runtime -- see effectiveLimit() in service.luau -- and only needs setting
# by hand when that gets it wrong.
[[setting]]
key = "full_at"
type = "int"
label_key = "settings.full_at.label"
description_key = "settings.full_at.description"
default = 0
min = 0
max = 100

[[setting]]
key = "low_threshold"
type = "int"
label_key = "settings.low_threshold.label"
description_key = "settings.low_threshold.description"
default = 20
min = 1
max = 99

[[setting]]
key = "medium_threshold"
type = "int"
label_key = "settings.medium_threshold.label"
description_key = "settings.medium_threshold.description"
default = 50
min = 1
max = 99

# These feed ImageMagick's -fill (service.luau), which has no notion of
# Noctalia's color roles — a bare role name like "on_primary" fails with
# "no decode delegate for this image format" since magick tries to read it
# as a file. service.luau's resolveColor() resolves a role name (as typed
# by Noctalia's own color-role picker, e.g. "primary"/"on_hover") against
# the active custom palette file before it ever reaches magick, so both
# role names and hex work here the same as in any built-in Noctalia color
# setting. Defaults below use the Google palette from Android's unified
# battery drawable, in case a custom palette can't be resolved.

[[setting]]
key = "low_color"
type = "color"
label_key = "settings.low_color.label"
description_key = "settings.low_color.description"
default = "#EA4335"

[[setting]]
key = "medium_color"
type = "color"
label_key = "settings.medium_color.label"
description_key = "settings.medium_color.description"
default = "#9AA0A6"

[[setting]]
key = "high_color"
type = "color"
label_key = "settings.high_color.label"
description_key = "settings.high_color.description"
default = "#9AA0A6"

[[setting]]
key = "charging_color"
type = "color"
label_key = "settings.charging_color.label"
description_key = "settings.charging_color.description"
default = "#34A853"

[[setting]]
key = "charging_bolt_color"
type = "color"
label_key = "settings.charging_bolt_color.label"
description_key = "settings.charging_bolt_color.description"
default = "#FFFFFF"

# The Battery Saver "+" drawn past the body (PLUS_ARMS in service.luau).
# It sits on the transparent canvas rather than on the battery fill, so it
# defaults to the terminal's colour, not the bolt's.
[[setting]]
key = "power_saver_plus_color"
type = "color"
label_key = "settings.power_saver_plus_color.label"
description_key = "settings.power_saver_plus_color.description"
default = "#F1F3F4"

[[setting]]
key = "text_color"
type = "color"
label_key = "settings.text_color.label"
description_key = "settings.text_color.description"
default = "#202124"

[[setting]]
key = "empty_color"
type = "color"
label_key = "settings.empty_color.label"
description_key = "settings.empty_color.description"
default = "#F1F3F4"

[[setting]]
key = "charging_sound_enabled"
type = "bool"
label_key = "settings.charging_sound_enabled.label"
description_key = "settings.charging_sound_enabled.description"
default = false

[[setting]]
key = "show_fan_controls"
type = "bool"
label_key = "settings.show_fan_controls.label"
description_key = "settings.show_fan_controls.description"
default = true

[[setting]]
key = "temperature_threshold"
type = "int"
label_key = "settings.temperature_threshold.label"
description_key = "settings.temperature_threshold.description"
default = 85
min = 40
max = 110

[[setting]]
key = "load_average_threshold"
type = "int"
label_key = "settings.load_average_threshold.label"
description_key = "settings.load_average_threshold.description"
default = 8
min = 1
max = 64

# ── Bar widget actions ───────────────────────────────────────────────────────

[[setting]]
key = "action_left_click"
type = "select"
label_key = "settings.action_left_click.label"
description_key = "settings.action.description"
default = "panel"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_power_profile", label_key = "settings.action.options.cycle_power_profile" },
  { value = "toggle_caffeine", label_key = "settings.action.options.toggle_caffeine" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_right_click"
type = "select"
label_key = "settings.action_right_click.label"
description_key = "settings.action.description"
default = "cycle_power_profile"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_power_profile", label_key = "settings.action.options.cycle_power_profile" },
  { value = "toggle_caffeine", label_key = "settings.action.options.toggle_caffeine" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_middle_click"
type = "select"
label_key = "settings.action_middle_click.label"
description_key = "settings.action.description"
default = "toggle_caffeine"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_power_profile", label_key = "settings.action.options.cycle_power_profile" },
  { value = "toggle_caffeine", label_key = "settings.action.options.toggle_caffeine" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_scroll_up"
type = "select"
label_key = "settings.action_scroll_up.label"
description_key = "settings.action.description"
default = "cycle_power_profile"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_power_profile", label_key = "settings.action.options.cycle_power_profile" },
  { value = "toggle_caffeine", label_key = "settings.action.options.toggle_caffeine" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_scroll_down"
type = "select"
label_key = "settings.action_scroll_down.label"
description_key = "settings.action.description"
default = "cycle_power_profile"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_power_profile", label_key = "settings.action.options.cycle_power_profile" },
  { value = "toggle_caffeine", label_key = "settings.action.options.toggle_caffeine" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "icon_width"
  type = "int"
  label_key = "settings.icon_width.label"
  description_key = "settings.icon_width.description"
  default = 36 # matches the rendered bitmap's 128x64 (2:1) aspect ratio at the default icon_height
  min = 16
  max = 96

  [[widget.setting]]
  key = "icon_height"
  type = "int"
  label_key = "settings.icon_height.label"
  description_key = "settings.icon_height.description"
  default = 18
  min = 8
  max = 48

[[panel]]
id = "power"
entry = "panel.luau"
width = 390
height = 460
placement = "attached"
position = "auto"
open_near_click = true
