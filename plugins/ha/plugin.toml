id = "pschmitt/ha"
name = "Home Assistant"
version = "0.13.24"
plugin_api = 24
author = "pschmitt"
license = "GPL-3.0-only"
icon = "smart-home"
description = "Status and toggle for a chosen handful of Home Assistant entities, with declarative sections and bounded conditional visibility."
tags = ["bar", "panel", "service", "indicator", "utility"]

# ── Connection ───────────────────────────────────────────────────────────────

[[setting]]
key = "server_file"
type = "file"
label_key = "settings.server_file.label"
description_key = "settings.server_file.description"
default = ""

[[setting]]
key = "token_file"
type = "file"
label_key = "settings.token_file.label"
description_key = "settings.token_file.description"
default = ""

[[setting]]
key = "allow_insecure_tls"
type = "bool"
label_key = "settings.allow_insecure_tls.label"
description_key = "settings.allow_insecure_tls.description"
default = false
advanced = true

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 30
min = 5
max = 300

# The picker's page size for browsing HA's full entity list. This is the knob
# that keeps this plugin working at all on a large instance: pozzoo/hassio (the
# community plugin this replaces) asked HA to render every entity in one
# `/api/template` call, which HA itself refuses past its template output-length
# cap, and its `/api/states` fallback decodes the whole state machine in one
# script tick, which blows Noctalia's per-callback CPU budget outright on an
# instance this size (7000+ entities, a 5+MB response). Paging keeps every
# single request's decode small regardless of how many entities HA has.
# Capped at 250, not higher: Noctalia silently drops any ui node's children
# past 256 (confirmed live -- "ui node 'scroll' has more than 256 children,
# extra dropped" -- a page of 300 was quietly losing its last 44 rows every
# time), and each result row is exactly one such child.
[[setting]]
key = "browser_page_size"
type = "int"
label_key = "settings.browser_page_size.label"
description_key = "settings.browser_page_size.description"
default = 200
min = 50
max = 250
advanced = true

[[setting]]
key = "animations_enabled"
type = "bool"
label_key = "settings.animations_enabled.label"
description_key = "settings.animations_enabled.description"
default = true

# ── Bar ──────────────────────────────────────────────────────────────────────

[[setting]]
key = "bar_display_mode"
type = "select"
label_key = "settings.bar_display_mode.label"
description_key = "settings.bar_display_mode.description"
default = "entities"
options = [
  { value = "entities", label_key = "settings.bar_display_mode.entities" },
  { value = "single", label_key = "settings.bar_display_mode.single" },
]

[[setting]]
key = "bar_icon"
type = "glyph"
label_key = "settings.bar_icon.label"
description_key = "settings.bar_icon.description"
default = "smart-home"

# Same runAction()/ACTIONS convention pschmitt/battery-icon uses for its own
# five interaction settings, right down to the shared settings.action.*
# description/option translation keys.
[[setting]]
key = "action_left_click"
type = "select"
label_key = "settings.action_left_click.label"
description_key = "settings.action.description"
default = "panel"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "open_dashboard", label_key = "settings.action.options.open_dashboard" },
  { value = "control_entity", label_key = "settings.action.options.control_entity" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_right_click"
type = "select"
label_key = "settings.action_right_click.label"
description_key = "settings.action.description"
default = "refresh"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "open_dashboard", label_key = "settings.action.options.open_dashboard" },
  { value = "control_entity", label_key = "settings.action.options.control_entity" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_middle_click"
type = "select"
label_key = "settings.action_middle_click.label"
description_key = "settings.action.description"
default = "open_dashboard"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "open_dashboard", label_key = "settings.action.options.open_dashboard" },
  { value = "control_entity", label_key = "settings.action.options.control_entity" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_scroll_up"
type = "select"
label_key = "settings.action_scroll_up.label"
description_key = "settings.action.description"
default = "none"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "open_dashboard", label_key = "settings.action.options.open_dashboard" },
  { value = "control_entity", label_key = "settings.action.options.control_entity" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key = "action_scroll_down"
type = "select"
label_key = "settings.action_scroll_down.label"
description_key = "settings.action.description"
default = "none"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "refresh", label_key = "settings.action.options.refresh" },
  { value = "open_dashboard", label_key = "settings.action.options.open_dashboard" },
  { value = "control_entity", label_key = "settings.action.options.control_entity" },
  { value = "none", label_key = "settings.action.options.none" },
]

# ── Panel ────────────────────────────────────────────────────────────────────

[[setting]]
key = "panel_dashboard_path"
type = "string"
label_key = "settings.panel_dashboard_path.label"
description_key = "settings.panel_dashboard_path.description"
default = "/"

[[setting]]
key = "panel_hide_edit_button"
type = "bool"
label_key = "settings.panel_hide_edit_button.label"
description_key = "settings.panel_hide_edit_button.description"
default = false

[[setting]]
key = "panel_show_search"
type = "bool"
label_key = "settings.panel_show_search.label"
description_key = "settings.panel_show_search.description"
default = false

[[setting]]
key = "panel_search_position"
type = "select"
label_key = "settings.panel_search_position.label"
description_key = "settings.panel_search_position.description"
default = "bottom"
options = [
  { value = "top", label_key = "settings.panel_search_position.top" },
  { value = "bottom", label_key = "settings.panel_search_position.bottom" },
]

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "bar_icon_size"
  type = "int"
  label_key = "settings.bar_icon_size.label"
  description_key = "settings.bar_icon_size.description"
  default = 16
  min = 10
  max = 48

  [[widget.setting]]
  key = "bar_spacing"
  type = "int"
  label_key = "settings.bar_spacing.label"
  description_key = "settings.bar_spacing.description"
  default = 6
  min = 0
  max = 32

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 640
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
