id = "pschmitt/ha-ai-usage"
name = "Home Assistant AI Usage"
version = "0.20.0"
plugin_api = 24
author = "pschmitt"
license = "GPL-3.0-only"
icon = "chart-donut-3"
description = "Dynamically discovered AI plan quotas from Home Assistant, with a compact icon-only bar mode."
tags = ["ai", "bar", "panel", "service", "indicator", "utility"]

# ── Connection ───────────────────────────────────────────────────────────────

[[setting]]
key = "server_file"
type = "file"
label_key = "settings.server_file.label"
description_key = "settings.server_file.description"
default = ""

[[setting]]
key = "token_file"
type = "file"
label_key = "settings.token_file.label"
description_key = "settings.token_file.description"
default = ""

[[setting]]
key = "allow_insecure_tls"
type = "bool"
label_key = "settings.allow_insecure_tls.label"
description_key = "settings.allow_insecure_tls.description"
default = false
advanced = true

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 60
min = 10
max = 3600

# ── Bar ──────────────────────────────────────────────────────────────────────

[[setting]]
key = "bar_display_mode"
type = "select"
label_key = "settings.bar_display_mode.label"
description_key = "settings.bar_display_mode.description"
default = "detailed"
options = [
  { value = "icon", label_key = "settings.bar_display_mode.icon" },
  { value = "detailed", label_key = "settings.bar_display_mode.detailed" },
]

[[setting]]
key = "bar_metric_window"
type = "select"
label_key = "settings.bar_metric_window.label"
description_key = "settings.bar_metric_window.description"
default = "short"
options = [
  { value = "all", label_key = "settings.bar_metric_window.all" },
  { value = "short", label_key = "settings.bar_metric_window.short" },
  { value = "weekly", label_key = "settings.bar_metric_window.weekly" },
  { value = "both", label_key = "settings.bar_metric_window.both" },
]

[[setting]]
key = "bar_card_filter"
type = "string"
label_key = "settings.bar_card_filter.label"
description_key = "settings.bar_card_filter.description"
default = ""

[[setting]]
key = "bar_metric_limit"
type = "int"
label_key = "settings.bar_metric_limit.label"
description_key = "settings.bar_metric_limit.description"
default = 3
min = 1
max = 20

[[setting]]
key = "bar_show_name"
type = "bool"
label_key = "settings.bar_show_name.label"
description_key = "settings.bar_show_name.description"
default = false

[[setting]]
key = "bar_show_value"
type = "bool"
label_key = "settings.bar_show_value.label"
description_key = "settings.bar_show_value.description"
default = false

[[setting]]
key = "bar_show_progress"
type = "bool"
label_key = "settings.bar_show_progress.label"
description_key = "settings.bar_show_progress.description"
default = true

[[setting]]
key = "bar_show_reset"
type = "bool"
label_key = "settings.bar_show_reset.label"
description_key = "settings.bar_show_reset.description"
default = false

[[setting]]
key = "bar_show_remaining"
type = "bool"
label_key = "settings.bar_show_remaining.label"
description_key = "settings.bar_show_remaining.description"
default = false

# ── Panel ────────────────────────────────────────────────────────────────────

[[setting]]
key = "panel_dashboard_path"
type = "string"
label_key = "settings.panel_dashboard_path.label"
description_key = "settings.panel_dashboard_path.description"
default = "/"

[[setting]]
key = "panel_card_filter"
type = "string"
label_key = "settings.panel_card_filter.label"
description_key = "settings.panel_card_filter.description"
default = ""

[[setting]]
key = "panel_compact"
type = "bool"
label_key = "settings.panel_compact.label"
description_key = "settings.panel_compact.description"
default = false

[[setting]]
key = "panel_all_metrics"
type = "bool"
label_key = "settings.panel_all_metrics.label"
description_key = "settings.panel_all_metrics.description"
default = true

[[setting]]
key = "panel_columns"
type = "select"
label_key = "settings.panel_columns.label"
description_key = "settings.panel_columns.description"
default = "1"
options = [
  { value = "1", label_key = "settings.panel_columns.one" },
  { value = "2", label_key = "settings.panel_columns.two" },
]

