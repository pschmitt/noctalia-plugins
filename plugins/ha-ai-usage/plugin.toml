# The ring counts the window down, so it gets its own colours rather than
# reusing the usage ones: no shipped palette has an orange role (Indigo's
# tertiary is lavender), hence the literal hex default.
[[setting]]
key = "panel_ring_normal_color"
type = "color"
label_key = "settings.panel_ring_normal_color.label"
description_key = "settings.panel_ring_normal_color.description"
default = "primary"

[[setting]]
key = "panel_ring_warning_color"
type = "color"
label_key = "settings.panel_ring_warning_color.label"
description_key = "settings.panel_ring_warning_color.description"
default = "#F5A97F"

[[setting]]
key = "panel_ring_critical_color"
type = "color"
label_key = "settings.panel_ring_critical_color.label"
description_key = "settings.panel_ring_critical_color.description"
default = "error"

