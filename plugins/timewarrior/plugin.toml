id = "pschmitt/timewarrior"
name = "Timewarrior"
version = "0.35.0"
# Uses Noctalia's argument-array subprocess API to run the declared `timew`
# dependency without a shell or a Nix-provided helper binary.
plugin_api = 24
author = "pschmitt"
license = "GPL-3.0-only"
# `timew` is the Timewarrior CLI. JSON is decoded with noctalia.json, so jq is
# deliberately not a runtime dependency.
dependencies = ["timew", "env"]
tags = ["bar", "productivity", "time-tracking"]
icon = "clock-hour-3"
description = "Currently tracked Timewarrior task duration, ported from the DMS/Waybar widget."

# ── Plugin-level settings (shared by every entry, edited in Settings -> Plugins) ──

[[setting]]
key = "database_path"
type = "string"
label_key = "settings.database_path.label"
description_key = "settings.database_path.description"
default = ""

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 5
min = 2
max = 60

[[setting]]
key = "overtime_hours"
type = "int"
label_key = "settings.overtime_hours.label"
description_key = "settings.overtime_hours.description"
default = 7
min = 1
max = 24

# The bar icon per state. Empty means the bundled artwork — the Timewarrior
# project logo while tracking, a pause symbol while stopped — which is what
# this widget has always drawn. Naming a glyph swaps that state's icon for it,
# tinted like the figure beside it, for anyone who would rather the bar stayed
# in one icon language than carry a project logo.
[[setting]]
key = "tracking_glyph"
type = "glyph"
label_key = "settings.tracking_glyph.label"
description_key = "settings.tracking_glyph.description"
default = ""

[[setting]]
key = "stopped_glyph"
type = "glyph"
label_key = "settings.stopped_glyph.label"
description_key = "settings.stopped_glyph.description"
default = ""

# Feierabend. Once `clock_out_after` intervals have been closed today and
# nothing is running, the bar swaps the stopped icon for `clock_out_glyph` — a
# beer, by default, which is the whole point of the feature: "the work part of
# the day is over" is worth a different mark than "the timer happens to be
# paused".
#
# The threshold counts closed intervals, not hours: 2 is a morning and an
# afternoon around a lunch break, and the second stop is Feierabend whether it
# lands at 16:00 or at 19:00. 0 — the default — turns it off, since a day's
# shape is a personal thing. Starting another interval puts the tracking icon
# back, and the state needs a `visibility` mode that keeps the slot while idle
# to be visible at all.
[[setting]]
key = "clock_out_after"
type = "int"
label_key = "settings.clock_out_after.label"
description_key = "settings.clock_out_after.description"
default = 0
min = 0
max = 12

[[setting]]
key = "clock_out_glyph"
type = "glyph"
label_key = "settings.clock_out_glyph.label"
description_key = "settings.clock_out_glyph.description"
default = "beer"

# Badge mode: instead of tracking_glyph/stopped_glyph/clock_out_glyph
# replacing the whole icon per state, keep one constant main icon (the
# bundled logo, or main_glyph) and composite whichever of those three glyphs
# matches the current state as a small corner badge on top of it -- the same
# idea as pschmitt/syncthing's status badges. Off leaves everything above
# exactly as it already behaves.
#
# This needs a rendered bitmap: Noctalia's plugin ui.* tree has no
# overlay/z-stack primitive to fake it with plain layout (confirmed against
# the reconciler itself -- box/image/glyph are hard-blocked from having
# children at all). Rendering the badge glyph needs Noctalia's own bundled
# icon font, which is not registered as a system font and not safely
# vendorable by this plugin collection (it would drift from whatever
# Noctalia version is actually installed) -- hence noctalia_assets_dir below.
[[setting]]
key = "badge_mode"
type = "bool"
label_key = "settings.badge_mode.label"
description_key = "settings.badge_mode.description"
default = false

[[setting]]
key = "main_glyph"
type = "glyph"
label_key = "settings.main_glyph.label"
description_key = "settings.main_glyph.description"
default = ""

[[setting]]
key = "badge_position"
type = "select"
label_key = "settings.badge_position.label"
description_key = "settings.badge_position.description"
default = "bottom_right"
options = [
  { value = "top_left", label_key = "settings.badge_position.top_left" },
  { value = "top_right", label_key = "settings.badge_position.top_right" },
  { value = "bottom_right", label_key = "settings.badge_position.bottom_right" },
  { value = "bottom_left", label_key = "settings.badge_position.bottom_left" },
]

# Point this at Noctalia's own installed `share/noctalia/assets/fonts`
# directory -- e.g. `"${pkgs.noctalia}/share/noctalia/assets/fonts"` in a Nix
# config that already sets `programs.noctalia.package`, so it is guaranteed
# to match whatever build is actually running. Badge mode silently falls
# back to the plain icon (no badge) while this is empty or wrong.
[[setting]]
key = "noctalia_assets_dir"
type = "string"
label_key = "settings.noctalia_assets_dir.label"
description_key = "settings.noctalia_assets_dir.description"
default = ""

# Optional breathing pulse on the badge itself while tracking -- the same
# idea as pschmitt/screencast's REC dot, mirrored onto badge mode's corner
# chip. Only the badge fades in and out; the main icon underneath stays put,
# since it is meant to say "this is what's running", not "something is
# recording". Off by default: badge mode is already a fairly busy corner of
# a small icon, and not everyone wants motion there.
[[setting]]
key = "badge_pulse_enabled"
type = "bool"
label_key = "settings.badge_pulse_enabled.label"
description_key = "settings.badge_pulse_enabled.description"
default = false

[[setting]]
key = "badge_pulse_period_ms"
type = "int"
label_key = "settings.badge_pulse_period_ms.label"
description_key = "settings.badge_pulse_period_ms.description"
default = 1200
min = 300
max = 5000

# What figure the bar widget shows. The running interval was the only thing it
# ever displayed, which answers "how long have I been at this?" but not the
# question actually being asked most of the time — "how much have I put in
# today?" — and it has nothing to say at all once the timer stops. Day is the
# default for that reason; interval is the old behaviour.
#
# Overtime colouring (see overtime_hours) applies to the interval and day
# figures, where a threshold in hours means something; week and month totals
# use the plain label colour, since they would otherwise sit permanently over
# any sane daily threshold.
[[setting]]
key = "bar_metric"
type = "select"
label_key = "settings.bar_metric.label"
description_key = "settings.bar_metric.description"
default = "day"
options = [
  { value = "interval", label_key = "settings.bar_metric.interval" },
  { value = "day", label_key = "settings.bar_metric.day" },
  { value = "week", label_key = "settings.bar_metric.week" },
  { value = "month", label_key = "settings.bar_metric.month" },
  { value = "icon", label_key = "settings.bar_metric.icon" },
]

# And what it shows while stopped, for the states where the slot survives an
# idle timer (see visibility). "same" — the default — means whatever
# bar_metric says, which is the sensible carry-over for a day/week/month
# figure. It is worth splitting because "interval" has nothing to show once the
# timer stops: that is the case where falling back to a total beats an icon on
# its own.
[[setting]]
key = "bar_metric_stopped"
type = "select"
label_key = "settings.bar_metric_stopped.label"
description_key = "settings.bar_metric_stopped.description"
default = "same"
options = [
  { value = "same", label_key = "settings.bar_metric_stopped.same" },
  { value = "interval", label_key = "settings.bar_metric.interval" },
  { value = "day", label_key = "settings.bar_metric.day" },
  { value = "week", label_key = "settings.bar_metric.week" },
  { value = "month", label_key = "settings.bar_metric.month" },
  { value = "icon", label_key = "settings.bar_metric.icon" },
]

# Whether the bar slot exists at all while nothing is tracked. This is
# plugin-scoped rather than widget-scoped (which is where it started life as
# the `hide_when_inactive` bool) because a bar entry declared inside a
# capsule_group is a bare "author/plugin:entry" id with nowhere to hang widget
# settings, and a Nix-managed config.toml is a read-only symlink, so Noctalia's
# per-widget settings UI can never persist one either. Same reasoning as
# ha-ai-usage's display settings.
#
# "tracking" is the long-standing behaviour (the DMS module's
# setVisibilityOverride(false)): the slot appears and disappears with the
# timer. The other two keep it in place showing assets/pause.svg instead of the
# logo — "always", or only Mon-Fri, for a widget that only means anything on a
# work day. Tracking always wins: an interval running on a Sunday is still
# shown.
[[setting]]
key = "visibility"
type = "select"
label_key = "settings.visibility.label"
description_key = "settings.visibility.description"
default = "tracking"
options = [
  { value = "tracking", label_key = "settings.visibility.tracking" },
  { value = "always", label_key = "settings.visibility.always" },
  { value = "workdays", label_key = "settings.visibility.workdays" },
  { value = "working_hours", label_key = "settings.visibility.working_hours" },
]

# Which days count as working days, as ISO weekday numbers (1 = Monday,
# 7 = Sunday) in a comma-separated list of numbers and ranges. Used by both
# "workdays" and "working_hours". Mon-Fri used to be hardcoded, which is only
# most people's week: "1-4,6" is a four-day week plus Saturday, "7,1-4" a week
# that starts on Sunday.
[[setting]]
key = "working_days"
type = "string"
label_key = "settings.working_days.label"
description_key = "settings.working_days.description"
default = "1-5"

# The hours "working_hours" keeps the slot in, on working_days, as local
# hours: inclusive start, exclusive end. start > end wraps around midnight;
# start == end means all day. Only consulted by that mode — and by none of
# them while a timer is running, which is never a moment to hide the widget.
[[setting]]
key = "working_hours_start"
type = "int"
label_key = "settings.working_hours_start.label"
description_key = "settings.working_hours_start.description"
default = 6
min = 0
max = 23

[[setting]]
key = "working_hours_end"
type = "int"
label_key = "settings.working_hours_end.label"
description_key = "settings.working_hours_end.description"
default = 20
min = 1
max = 24

# How far back the panel's day breakdown reaches, in days ending today. The
# breakdown used to be exactly `:week`, which on a Monday is a single row —
# nothing to click, and no way to fix up last Friday. Every day it lists is
# clickable and editable, and they all come from one export, so this is also
# what bounds that export.
[[setting]]
key = "breakdown_days"
type = "int"
label_key = "settings.breakdown_days.label"
description_key = "settings.breakdown_days.description"
default = 14
min = 2
max = 62

# How precise the panel renders today's interval boundaries — and, because the
# edit field seeds from what is displayed, the precision an edit defaults to.
# `timew` itself always stores seconds, and a HH:MM edit is applied as :00, so
# "minutes" can quietly zero a second-precision boundary; that is the trade for
# a list that reads cleanly.
[[setting]]
key = "interval_precision"
type = "select"
label_key = "settings.interval_precision.label"
description_key = "settings.interval_precision.description"
default = "minutes"
options = [
  { value = "minutes", label_key = "settings.interval_precision.minutes" },
  { value = "seconds", label_key = "settings.interval_precision.seconds" },
]

# ── Sync ──
# Off by default: syncing is a Timewarrior deployment choice, not something
# every user of this widget has. Enabled, it puts a sync button next to the
# panel's settings gear; the command is whatever moves your data — `timewsync`
# for the timew-sync-server client, or a wrapper that syncs Taskwarrior in the
# same breath. Run through /bin/sh -c with TIMEWARRIORDB exported, like the
# start/stop hooks, and bounded by the same command_timeout.
[[setting]]
key = "sync_enabled"
type = "bool"
label_key = "settings.sync_enabled.label"
description_key = "settings.sync_enabled.description"
default = false

[[setting]]
key = "sync_command"
type = "string"
label_key = "settings.sync_command.label"
description_key = "settings.sync_command.description"
default = "timewsync"

# ── Start/stop hooks ──
# The panel's toggle button (and the bar's middle click) run these instead of
# `timew start` / `timew stop` when they are set, so a wrapper can own the rest
# of the ritual — VPN, Taskwarrior task, notifications, sync — while the plugin
# keeps owning the UI. Shell command lines, not argv: they run through
# /bin/sh -c with the resolved TIMEWARRIORDB exported.

[[setting]]
key = "start_command"
type = "string"
label_key = "settings.start_command.label"
description_key = "settings.start_command.description"
default = ""

[[setting]]
key = "stop_command"
type = "string"
label_key = "settings.stop_command.label"
description_key = "settings.stop_command.description"
default = ""

# Wrappers can be slow (shutting a VM down, syncing, closing browser tabs), so
# the default is far more generous than the 5s the `timew export` polls use.
[[setting]]
key = "command_timeout"
type = "int"
label_key = "settings.command_timeout.label"
description_key = "settings.command_timeout.description"
default = 120
min = 5
max = 900

[[setting]]
key = "panel_time_format"
type = "string"
label_key = "settings.panel_time_format.label"
description_key = "settings.panel_time_format.description"
default = "{hours}h {minutes}m"

# How many hours count as a day wherever a format uses {days}: 8 for work days
# (the point of {days} — "149d 3h" of tracked time reads far better than
# "1195h"), 24 for calendar days. Only consulted by formats that mention
# {days}; everything else keeps counting in whole hours.
[[setting]]
key = "hours_per_day"
type = "int"
label_key = "settings.hours_per_day.label"
description_key = "settings.hours_per_day.description"
default = 8
min = 1
max = 24

# The three stat boxes get their own formats, because they are read very
# differently: the week figure is something you compare against a target to the
# minute, while a month or a year total is a magnitude — "1194h 33m" is just
# noise where "1194h" says the same thing. Empty falls back to
# panel_time_format, which still formats the day rows and interval durations.
[[setting]]
key = "week_time_format"
type = "string"
label_key = "settings.week_time_format.label"
description_key = "settings.week_time_format.description"
default = "{hours}h {minutes}m"

[[setting]]
key = "month_time_format"
type = "string"
label_key = "settings.month_time_format.label"
description_key = "settings.month_time_format.description"
default = "{hours}h"

[[setting]]
key = "year_time_format"
type = "string"
label_key = "settings.year_time_format.label"
description_key = "settings.year_time_format.description"
default = "{hours}h"

# Noctalia's text stack has no slant: labels take a family, a weight and a
# size, and the renderer never asks Pango for an italic style. So italics are
# only reachable by naming a family that resolves to an italic face — which no
# real font family does on its own, since they all ship a Roman face too. A
# fontconfig alias closes that gap, e.g.
#
#   <match target="pattern">
#     <test name="family" compare="eq"><string>ComicCode Italic</string></test>
#     <edit name="family" mode="assign" binding="same">
#       <string>ComicCode Nerd Font</string></edit>
#     <edit name="slant" mode="assign" binding="same"><const>italic</const></edit>
#   </match>
#
# and then this setting names that alias. Empty keeps the shell font.
[[setting]]
key = "italic_font_family"
type = "string"
label_key = "settings.italic_font_family.label"
description_key = "settings.italic_font_family.description"
default = ""

[[setting]]
key = "label_color"
type = "color"
label_key = "settings.label_color.label"
description_key = "settings.label_color.description"
default = "on_surface"

[[setting]]
key = "label_overtime_color"
type = "color"
label_key = "settings.label_overtime_color.label"
description_key = "settings.label_overtime_color.description"
default = "error"

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label_key = "settings.icon_size.label"
  description_key = "settings.icon_size.description"
  default = 16
  min = 12
  max = 32

  # "{hours}:{minutes}" reproduces the plain "H:MM" text the bar showed
  # before the logo/time_format change (state.duration passed straight to
  # setText) — a bar-specific default, distinct from the panel's.
  [[widget.setting]]
  key = "bar_time_format"
  type = "string"
  label_key = "settings.bar_time_format.label"
  description_key = "settings.bar_time_format.description"
  default = "{hours}:{minutes}"

  # Routed through the anchored panel-toggle dispatcher (same one native bar
  # widgets use) so the panel opens under the click instead of centered on
  # the bar — noctalia.togglePanel() always opens unanchored. Users can
  # override or disable it per-instance in Settings, same as any built-in
  # widget's actions.
  [widget.actions]
  left = "panel-toggle pschmitt/timewarrior:panel"
  # Start/stop without opening the panel. Routed to the service's onIpc, which
  # is the same code path the panel's toggle button ends up in.
  middle = "plugin pschmitt/timewarrior:poller all toggle"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
# Taller than the original 560: the editable interval rows sit between the
# week/month/year boxes and the day breakdown. Keep PANEL_HEIGHT in panel.luau
# in sync — it needs this number to give the breakdown's scroll area a bounded
# box to scroll inside.
height = 680
placement = "attached"
position = "auto"
open_near_click = true
