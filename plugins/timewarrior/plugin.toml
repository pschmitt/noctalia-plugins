id = "pschmitt/timewarrior"
name = "Timewarrior"
version = "0.11.0"
# Uses Noctalia's argument-array subprocess API to run the declared `timew`
# dependency without a shell or a Nix-provided helper binary.
plugin_api = 24
author = "pschmitt"
license = "GPL-3.0-only"
# `timew` is the Timewarrior CLI. JSON is decoded with noctalia.json, so jq is
# deliberately not a runtime dependency.
dependencies = ["timew", "env"]
tags = ["bar", "productivity", "time-tracking"]
icon = "clock-hour-3"
description = "Currently tracked Timewarrior task duration, ported from the DMS/Waybar widget."

# ── Plugin-level settings (shared by every entry, edited in Settings -> Plugins) ──

[[setting]]
key = "database_path"
type = "string"
label_key = "settings.database_path.label"
description_key = "settings.database_path.description"
default = ""

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 5
min = 2
max = 60

[[setting]]
key = "overtime_hours"
type = "int"
label_key = "settings.overtime_hours.label"
description_key = "settings.overtime_hours.description"
default = 7
min = 1
max = 24

# Whether the bar slot exists at all while nothing is tracked. This is
# plugin-scoped rather than widget-scoped (which is where it started life as
# the `hide_when_inactive` bool) because a bar entry declared inside a
# capsule_group is a bare "author/plugin:entry" id with nowhere to hang widget
# settings, and a Nix-managed config.toml is a read-only symlink, so Noctalia's
# per-widget settings UI can never persist one either. Same reasoning as
# ha-ai-usage's display settings.
#
# "tracking" is the long-standing behaviour (the DMS module's
# setVisibilityOverride(false)): the slot appears and disappears with the
# timer. The other two keep it in place showing assets/pause.svg instead of the
# logo — "always", or only Mon-Fri, for a widget that only means anything on a
# work day. Tracking always wins: an interval running on a Sunday is still
# shown.
[[setting]]
key = "visibility"
type = "select"
label_key = "settings.visibility.label"
description_key = "settings.visibility.description"
default = "tracking"
options = [
  { value = "tracking", label_key = "settings.visibility.tracking" },
  { value = "always", label_key = "settings.visibility.always" },
  { value = "workdays", label_key = "settings.visibility.workdays" },
]

# ── Start/stop hooks ──
# The panel's toggle button (and the bar's middle click) run these instead of
# `timew start` / `timew stop` when they are set, so a wrapper can own the rest
# of the ritual — VPN, Taskwarrior task, notifications, sync — while the plugin
# keeps owning the UI. Shell command lines, not argv: they run through
# /bin/sh -c with the resolved TIMEWARRIORDB exported.

[[setting]]
key = "start_command"
type = "string"
label_key = "settings.start_command.label"
description_key = "settings.start_command.description"
default = ""

[[setting]]
key = "stop_command"
type = "string"
label_key = "settings.stop_command.label"
description_key = "settings.stop_command.description"
default = ""

# Wrappers can be slow (shutting a VM down, syncing, closing browser tabs), so
# the default is far more generous than the 5s the `timew export` polls use.
[[setting]]
key = "command_timeout"
type = "int"
label_key = "settings.command_timeout.label"
description_key = "settings.command_timeout.description"
default = 120
min = 5
max = 900

[[setting]]
key = "panel_time_format"
type = "string"
label_key = "settings.panel_time_format.label"
description_key = "settings.panel_time_format.description"
default = "{hours}h {minutes}m"

[[setting]]
key = "label_color"
type = "color"
label_key = "settings.label_color.label"
description_key = "settings.label_color.description"
default = "on_surface"

[[setting]]
key = "label_overtime_color"
type = "color"
label_key = "settings.label_overtime_color.label"
description_key = "settings.label_overtime_color.description"
default = "error"

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label_key = "settings.icon_size.label"
  description_key = "settings.icon_size.description"
  default = 16
  min = 12
  max = 32

  # "{hours}:{minutes}" reproduces the plain "H:MM" text the bar showed
  # before the logo/time_format change (state.duration passed straight to
  # setText) — a bar-specific default, distinct from the panel's.
  [[widget.setting]]
  key = "bar_time_format"
  type = "string"
  label_key = "settings.bar_time_format.label"
  description_key = "settings.bar_time_format.description"
  default = "{hours}:{minutes}"

  # Routed through the anchored panel-toggle dispatcher (same one native bar
  # widgets use) so the panel opens under the click instead of centered on
  # the bar — noctalia.togglePanel() always opens unanchored. Users can
  # override or disable it per-instance in Settings, same as any built-in
  # widget's actions.
  [widget.actions]
  left = "panel-toggle pschmitt/timewarrior:panel"
  # Start/stop without opening the panel. Routed to the service's onIpc, which
  # is the same code path the panel's toggle button ends up in.
  middle = "plugin pschmitt/timewarrior:poller all toggle"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
# Taller than the original 560: today's editable interval rows sit between the
# week/month/year boxes and the weekly breakdown.
height = 680
placement = "attached"
position = "auto"
open_near_click = true
