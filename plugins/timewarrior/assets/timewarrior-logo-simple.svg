<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Reduced variant of timewarrior-logo.svg for badge_mode's small composite
     icon (see lib/badge_icon.luau): the full logo's thin decorative ring
     (a second, closely-spaced circle just inside the disc's edge) survives
     down to maybe 24px but is pure noise at 16px -- it does not fade, it
     aliases into a fuzzy double band, which was the actual bulk of the
     "blurry" look, more than the resolution itself. This drops that ring and
     scales the disc back out to fill the same footprint the full logo did,
     keeping only the one shape that still reads at a glance that small: the
     helmet silhouette. Same path data as the original for that shape --
     this is a subtraction, not a redraw. -->
