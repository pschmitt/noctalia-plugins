id          = "pschmitt/fan-control"
name        = "Fan Control"
version     = "1.5.26"
plugin_api  = 3
author      = "pschmitt (fork of piero-93/thinkpad-fan)"
license     = "GPL-3.0"
icon        = "car-fan"
description = "Fan speed monitor and manual control for thinkpad_acpi (ThinkPad) and generic hwmon PWM fans (Dell dell-smm-hwmon, GPD gpdfan, etc.) — no root at runtime."
tags        = ["bar", "panel", "system", "hardware", "indicator", "utility"]
dependencies = ["sh", "cat", "nproc"]

[[setting]]
key            = "bar_display"
type           = "select"
label_key      = "settings.bar_display.label"
description_key = "settings.bar_display.description"
default        = "rpm"
options = [
  { value = "rpm", label_key = "settings.bar_display.options.rpm" },
  { value = "temp", label_key = "settings.bar_display.options.temp" },
  { value = "none", label_key = "settings.bar_display.options.none" },
]

[[setting]]
key            = "bar_show_units"
type           = "bool"
label_key      = "settings.bar_show_units.label"
description_key = "settings.bar_show_units.description"
default        = true

[[setting]]
key            = "bar_icon"
type           = "select"
label_key      = "settings.bar_icon.label"
description_key = "settings.bar_icon.description"
default        = "fan"
options = [
  { value = "fan", label_key = "settings.bar_icon.options.fan" },
  { value = "thermometer", label_key = "settings.bar_icon.options.thermometer" },
]

[[setting]]
key            = "alt_mode"
type           = "bool"
label_key      = "settings.alt_mode.label"
description_key = "settings.alt_mode.description"
default        = false

[[setting]]
key            = "percent_step"
type           = "int"
label_key      = "settings.percent_step.label"
description_key = "settings.percent_step.description"
default        = 10
min            = 1
max            = 50

# ── Colors ───────────────────────────────────────────────────────────────────
# Whether the icon and/or the bar text get tinted at all, what decides the
# tint (color_trigger), and the colors for each trigger. Every *_color
# setting defaults to empty, which keeps the theme-relative token named in
# its description; set one to override just that state/tier.

[[setting]]
key            = "colorize_icon"
type           = "bool"
label_key      = "settings.colorize_icon.label"
description_key = "settings.colorize_icon.description"
default        = true

[[setting]]
key            = "colorize_text"
type           = "bool"
label_key      = "settings.colorize_text.label"
description_key = "settings.colorize_text.description"
default        = true

[[setting]]
key            = "color_trigger"
type           = "select"
label_key      = "settings.color_trigger.label"
description_key = "settings.color_trigger.description"
default        = "mode"
options = [
  { value = "mode", label_key = "settings.color_trigger.options.mode" },
  { value = "temp", label_key = "settings.color_trigger.options.temp" },
  { value = "rpm", label_key = "settings.color_trigger.options.rpm" },
]

# color_trigger = "mode": one color per Auto/Manual/Full state.

[[setting]]
key            = "auto_color"
type           = "color"
label_key      = "settings.auto_color.label"
description_key = "settings.auto_color.description"
default        = ""

[[setting]]
key            = "manual_color"
type           = "color"
label_key      = "settings.manual_color.label"
description_key = "settings.manual_color.description"
default        = ""

[[setting]]
key            = "full_color"
type           = "color"
label_key      = "settings.full_color.label"
description_key = "settings.full_color.description"
default        = ""

[[setting]]
key            = "load_high_color"
type           = "color"
label_key      = "settings.load_high_color.label"
description_key = "settings.load_high_color.description"
default        = ""

# color_trigger = "temp": below temp_threshold_low / between / at-or-above
# temp_threshold_high.

[[setting]]
key            = "temp_threshold_low"
type           = "int"
label_key      = "settings.temp_threshold_low.label"
description_key = "settings.temp_threshold_low.description"
default        = 60
min            = 0
max            = 120

[[setting]]
key            = "temp_threshold_high"
type           = "int"
label_key      = "settings.temp_threshold_high.label"
description_key = "settings.temp_threshold_high.description"
default        = 80
min            = 0
max            = 120

[[setting]]
key            = "temp_low_color"
type           = "color"
label_key      = "settings.temp_low_color.label"
description_key = "settings.temp_low_color.description"
default        = ""

[[setting]]
key            = "temp_mid_color"
type           = "color"
label_key      = "settings.temp_mid_color.label"
description_key = "settings.temp_mid_color.description"
default        = ""

[[setting]]
key            = "temp_high_color"
type           = "color"
label_key      = "settings.temp_high_color.label"
description_key = "settings.temp_high_color.description"
default        = ""

# color_trigger = "rpm": below rpm_threshold_low / between / at-or-above
# rpm_threshold_high.

[[setting]]
key            = "rpm_threshold_low"
type           = "int"
label_key      = "settings.rpm_threshold_low.label"
description_key = "settings.rpm_threshold_low.description"
default        = 2000
min            = 0
max            = 10000

[[setting]]
key            = "rpm_threshold_high"
type           = "int"
label_key      = "settings.rpm_threshold_high.label"
description_key = "settings.rpm_threshold_high.description"
default        = 4000
min            = 0
max            = 10000

[[setting]]
key            = "rpm_low_color"
type           = "color"
label_key      = "settings.rpm_low_color.label"
description_key = "settings.rpm_low_color.description"
default        = ""

[[setting]]
key            = "rpm_mid_color"
type           = "color"
label_key      = "settings.rpm_mid_color.label"
description_key = "settings.rpm_mid_color.description"
default        = ""

[[setting]]
key            = "rpm_high_color"
type           = "color"
label_key      = "settings.rpm_high_color.label"
description_key = "settings.rpm_high_color.description"
default        = ""

[[setting]]
key            = "thermal_zone"
type           = "string"
label_key      = "settings.thermal_zone.label"
description_key = "settings.thermal_zone.description"
default        = "thermal_zone0"

[[setting]]
key            = "hwmon_name"
type           = "string"
label_key      = "settings.hwmon_name.label"
description_key = "settings.hwmon_name.description"
default        = ""

# ── Bar widget actions ───────────────────────────────────────────────────────

[[setting]]
key            = "action_left_click"
type           = "select"
label_key      = "settings.action_left_click.label"
description_key = "settings.action.description"
default        = "panel"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_mode", label_key = "settings.action.options.cycle_mode" },
  { value = "increase", label_key = "settings.action.options.increase" },
  { value = "decrease", label_key = "settings.action.options.decrease" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key            = "action_right_click"
type           = "select"
label_key      = "settings.action_right_click.label"
description_key = "settings.action.description"
default        = "cycle_mode"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_mode", label_key = "settings.action.options.cycle_mode" },
  { value = "increase", label_key = "settings.action.options.increase" },
  { value = "decrease", label_key = "settings.action.options.decrease" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key            = "action_middle_click"
type           = "select"
label_key      = "settings.action_middle_click.label"
description_key = "settings.action.description"
default        = "none"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_mode", label_key = "settings.action.options.cycle_mode" },
  { value = "increase", label_key = "settings.action.options.increase" },
  { value = "decrease", label_key = "settings.action.options.decrease" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key            = "action_scroll_up"
type           = "select"
label_key      = "settings.action_scroll_up.label"
description_key = "settings.action.description"
default        = "increase"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_mode", label_key = "settings.action.options.cycle_mode" },
  { value = "increase", label_key = "settings.action.options.increase" },
  { value = "decrease", label_key = "settings.action.options.decrease" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[setting]]
key            = "action_scroll_down"
type           = "select"
label_key      = "settings.action_scroll_down.label"
description_key = "settings.action.description"
default        = "decrease"
options = [
  { value = "panel", label_key = "settings.action.options.panel" },
  { value = "cycle_mode", label_key = "settings.action.options.cycle_mode" },
  { value = "increase", label_key = "settings.action.options.increase" },
  { value = "decrease", label_key = "settings.action.options.decrease" },
  { value = "none", label_key = "settings.action.options.none" },
]

[[widget]]
id    = "widget"
entry = "widget.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 340
height          = 260
placement       = "attached"
position        = "auto"
open_near_click = true

[[service]]
id    = "service"
entry = "service.luau"
