# Custom OSD toast, triggered via CLI/IPC — the Noctalia counterpart to
# pkgs/local/dms-shell-critical-notifications' DMS toast IPC. Noctalia has no
# generic "show an arbitrary OSD" primitive of its own (only fixed-purpose
# ones: brightness-osd, volume-osd, mic-volume-osd, keyboard-backlight-osd),
# so this plugin provides one, matching pkgs/local/osd's feature set:
# severity, category (informational dedupe key), a click-to-run command, and
# an auto-dismiss timeout.
#
# Usage:
#   noctalia msg panel-open pschmitt/osd:toast '{"summary":"Feierabend","body":"23 minutes left","severity":"info","timeout_ms":4000}'
#   noctalia msg panel-open pschmitt/osd:compact '{"summary":"Feierabend"}'
#   noctalia msg panel-close pschmitt/osd:toast
#   noctalia msg plugin pschmitt/osd:toast all dismiss <category>

id = "pschmitt/osd"
name = "Custom OSD"
version = "1.8.0"
plugin_api = 14
author = "pschmitt"
license = "MIT"
tags = ["panel", "utility", "notifications"]
icon = "bell"
description = "Ad-hoc on-screen toast, triggered via CLI/IPC with a JSON payload (summary, body, severity, category, command, timeout_ms)."

[[setting]]
key = "default_timeout_ms"
type = "int"
label_key = "settings.default_timeout_ms.label"
description_key = "settings.default_timeout_ms.description"
default = 4000
min = 500
max = 60000

[[setting]]
key = "show_icon"
type = "bool"
label_key = "settings.show_icon.label"
description_key = "settings.show_icon.description"
default = true

# The host measures content width and adds Style::panelPadding (14px per
# side, not configurable from a plugin).
[[setting]]
key = "icon_size"
type = "int"
label_key = "settings.icon_size.label"
description_key = "settings.icon_size.description"
default = 20
min = 12
max = 32

[[setting]]
key = "icon_text_gap"
type = "int"
label_key = "settings.icon_text_gap.label"
description_key = "settings.icon_text_gap.description"
default = 10
min = 0
max = 32
advanced = true

[[setting]]
key = "line_gap"
type = "int"
label_key = "settings.line_gap.label"
description_key = "settings.line_gap.description"
default = 2
min = 0
max = 16
advanced = true

[[setting]]
key = "content_padding_h"
type = "int"
label_key = "settings.content_padding_h.label"
description_key = "settings.content_padding_h.description"
default = 0
min = 0
max = 24
advanced = true

[[setting]]
key = "content_padding_v"
type = "int"
label_key = "settings.content_padding_v.label"
description_key = "settings.content_padding_v.description"
default = 0
min = 0
max = 12
advanced = true

[[setting]]
key = "max_text_width"
type = "int"
label_key = "settings.max_text_width.label"
description_key = "settings.max_text_width.description"
default = 0
min = 0
max = 462
advanced = true

[[setting]]
key = "summary_font_size"
type = "int"
label_key = "settings.summary_font_size.label"
description_key = "settings.summary_font_size.description"
default = 14
min = 10
max = 24

[[setting]]
key = "summary_font_weight"
type = "select"
label_key = "settings.summary_font_weight.label"
description_key = "settings.summary_font_weight.description"
default = "bold"
options = [
  { value = "normal", label_key = "settings.font_weight.normal" },
  { value = "medium", label_key = "settings.font_weight.medium" },
  { value = "semibold", label_key = "settings.font_weight.semibold" },
  { value = "bold", label_key = "settings.font_weight.bold" },
]

[[setting]]
key = "summary_color"
type = "color"
label_key = "settings.summary_color.label"
description_key = "settings.summary_color.description"
default = "on_surface"

[[setting]]
key = "body_font_size"
type = "int"
label_key = "settings.body_font_size.label"
description_key = "settings.body_font_size.description"
default = 12
min = 9
max = 20

[[setting]]
key = "body_color"
type = "color"
label_key = "settings.body_color.label"
description_key = "settings.body_color.description"
default = "on_surface_variant"

[[setting]]
key = "text_align"
type = "select"
label_key = "settings.text_align.label"
description_key = "settings.text_align.description"
default = "start"
options = [
  { value = "start", label_key = "settings.text_align.start" },
  { value = "center", label_key = "settings.text_align.center" },
  { value = "end", label_key = "settings.text_align.end" },
]

[[setting]]
